name: Build AstroBackport (Forge 1.16.1)

on:
  push:
    branches: [main]
    paths:
      - "Mod.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "4.10.3"

      - name: Verify archive
        run: |
          test -f Mod.zip || { echo "::error::Mod.zip is missing from the repository root."; exit 1; }
          unzip -t Mod.zip
          mkdir -p build-src
          unzip -q Mod.zip -d build-src
          test -f build-src/AstroBackport-1.16.1-2.0.0/build.gradle

      - name: Compile and reobfuscate
        working-directory: build-src/AstroBackport-1.16.1-2.0.0
        run: |
          java -version
          gradle --version
          gradle --no-daemon clean build

      - name: Verify mod JAR
        run: |
          JAR="build-src/AstroBackport-1.16.1-2.0.0/build/libs/AstroBackport-1.16.1-2.0.0.jar"
          test -s "$JAR" || { echo "::error::Expected reobfuscated JAR was not produced."; find build-src/AstroBackport-1.16.1-2.0.0/build -maxdepth 4 -type f -print; exit 1; }
          ls -lh "$JAR"

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstroBackport-1.16.1-Forge-32.0.108
          path: build-src/AstroBackport-1.16.1-2.0.0/build/libs/AstroBackport-1.16.1-2.0.0.jar
          if-no-files-found: error
          retention-days: 30
