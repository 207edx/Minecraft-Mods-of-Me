name: Build AstroBackport 1.16.1 Forge

on:
  push:
    branches: [main]
    paths:
      - "Mod.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "4.10.3"

      - name: Verify original ZIP
        run: |
          test -s Mod.zip || { echo "::error::Upload the original Mod.zip to the repository root."; exit 1; }
          unzip -t Mod.zip
          sha256sum Mod.zip

      - name: Extract source project
        run: |
          mkdir -p build-src
          unzip -q Mod.zip -d build-src
          test -f build-src/AstroBackport-1.16.1-2.0.0/build.gradle
          test -d build-src/AstroBackport-1.16.1-2.0.0/src/main/java
          test -d build-src/AstroBackport-1.16.1-2.0.0/src/main/resources

      - name: Compile and reobfuscate
        working-directory: build-src/AstroBackport-1.16.1-2.0.0
        run: |
          java -version
          gradle --version
          gradle --no-daemon clean build

      - name: List and validate JAR
        shell: bash
        run: |
          set -euo pipefail
          find build-src/AstroBackport-1.16.1-2.0.0/build/libs -maxdepth 1 -type f -name '*.jar' -print
          JAR="$(find build-src/AstroBackport-1.16.1-2.0.0/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          test -n "$JAR"
          test -s "$JAR"
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"
          ls -lh "$JAR"

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: AstroBackport-1.16.1-Forge-32.0.108
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error
          retention-days: 30
